[task]
name = "Crear el diagrama de actividades del notebook de Clase 08"
language = "es"
role = "Analista de software que documenta el flujo real de ejecución de un notebook Python"
objective = "Generar un único diagrama de actividades PlantUML del notebook TI-support-RAG, incluyendo decisiones, ramas opcionales, validaciones, servicios externos y evidencias."

[reference]
project = "TI-support-RAG"
notebook = "backend/notebooks/clase_08_rag_supabase_groq.ipynb"
local_path = "/home/dvdm12/Documents/Obsidian Vault/TI-support-RAG/backend/notebooks/clase_08_rag_supabase_groq.ipynb"
version_description = "Versión guardada de 27 celdas, 13 de código, con opciones y anexos de OCR/API. No confundir con la versión simplificada anterior de diez celdas de código."
inspected_date = "2026-10-14"
sha256_at_inspection = "da7d958e02714e6b886f9e0ae8e6d91698cb76a26c8ff761f08d6086476fc28e"
reading_rule = "Si se adjunta el notebook, lee sus celdas de código y usa su contenido como autoridad. La ruta local solo identifica el archivo: no asumas que puedes abrirla desde ChatGPT. Sin adjunto, usa esta especificación y declara mediante una nota que el diagrama se basa en ella. Si hay discrepancias, documenta la diferencia y prioriza el archivo adjunto."
related_components = [
  "src/rag/pipeline.py", "src/rag/retrieval.py", "src/rag/context.py",
  "src/rag/repository.py", "src/rag/citations.py", "src/rag/support.py",
  "src/rag/policy.py", "src/rag/applicability.py", "src/token_budget.py",
  "src/pdf_report.py", "src/multimodal.py", "scripts/verify_supabase.py"
]

[current_configuration]
ENABLE_EMBEDDINGS = true
CONNECT_SUPABASE = true
UPLOAD_EXISTING_INDEX = false
RUN_GROQ_QUERY = true
RUN_CLASS08_CASES = false
RUN_REMOTE_REGRESSION = false
COMPARE_CHUNKING = false
RUN_OCR = false
RUN_API_CHECKS = false
RUN_LOCAL_TESTS = false
GENERATE_PDF = false
RUN_LOCAL_MOCK = false

[diagram]
type = "activity"
syntax = "PlantUML: sintaxis moderna de diagramas de actividades"
title = "TI-support-RAG — Flujo de actividades del notebook Clase 08"
direction = "De arriba hacia abajo"
output_file = "clase_08_notebook_actividades.puml"
output_format = "Devuelve exclusivamente un bloque de código plantuml completo con @startuml y @enduml, listo para renderizar."
style = "Fondo claro, texto en español, etiquetas breves y contraste legible. Usar particiones por fases del notebook y notas para identificar Supabase, Groq y archivos."
notation = "Usar start/stop, actividades, if/then/else/endif y bucles donde existan realmente. Evitar sintaxis de secuencia, clases o componentes."
configuration_display = "Mostrar todas las ramas configurables, incluso las desactivadas, indicando el valor actual mediante etiquetas o notas. No representar una rama desactivada como si se hubiera ejecutado."

[flow]
execution_order = [
  "1. Preparación y configuración",
  "2. Conexión Supabase",
  "3. Corpus e índice",
  "4. Modelo de embeddings y comparación opcional",
  "5. Carga opcional del índice",
  "6. Recuperación de candidatos",
  "7. Contrato y presupuesto",
  "8. Consulta RAG o mock",
  "9. Pruebas opcionales",
  "10. Persistencia y PDF opcional",
  "Anexo A. OCR opcional",
  "Anexo B. API opcional",
  "Cierre. Bitácora y pendientes"
]

[[flow.steps]]
name = "1. Preparación"
actions = [
  "Encontrar PROJECT_ROOT a partir del directorio actual y sus padres",
  "Cambiar a la raíz y añadirla a sys.path",
  "Verificar que sys.prefix corresponde a ../.venv",
  "Definir opciones, pregunta, rutas y acumuladores de resultados"
]
errors = "Si no existe la raíz o el kernel es incorrecto, RuntimeError y detener Run All. No dibujar un cambio automático de kernel."

[[flow.steps]]
name = "2. Conexión"
condition = "CONNECT_SUPABASE"
on_true = "SupabaseRepository.connect(): cargar secretos localmente, validar URL/clave publicable e iniciar sesión Supabase Auth."
on_false = "Dejar remote_repository en None y mostrar conexión no ejecutada."
notes = "No imprimir credenciales. Esta autenticación no es la cuenta del panel ni la contraseña PostgreSQL. Un fallo no capturado detiene la ejecución secuencial."

[[flow.steps]]
name = "3. Corpus e índice"
actions = [
  "Leer manifiesto y cargar secciones PDF mediante load_corpus",
  "Cargar corpus_id, fragmentos, vectores y configuración con load_index",
  "Validar integridad del índice y mostrar metadatos"
]
notes = "Corpus académico simulado: siete PDF, 35 secciones, 70 fragmentos; siete categorías de soporte TI. No recalcular todo el corpus para consultar."

[[flow.steps]]
name = "4. Embeddings y comparación"
condition = "ENABLE_EMBEDDINGS"
on_true = "Cargar SentenceEmbedder con la revisión del índice y comprobar compatibilidad/muestras."
on_false = "Mantener embedder en None; no hay recuperación en esta sesión."
secondary_condition = "COMPARE_CHUNKING"
secondary_true = "Exigir embedder; comparar characters, overlap y sections, y guardar comparison.json e índices de comparación en el directorio de resultados."
secondary_false = "Mostrar la comparación histórica si existe, identificándola como histórica."
notes = "384 dimensiones normalizadas, coseno; máximo efectivo del embedder 128 tokens. Comparación no asigna automáticamente una estrategia ganadora."

[[flow.steps]]
name = "5. Carga"
condition = "UPLOAD_EXISTING_INDEX"
on_true = "Exigir remote_repository y embedder; realizar upsert de la construcción existente en Supabase."
on_false = "No escribir filas."
notes = "Upsert por propietario/corpus/fragmento; no elimina versiones antiguas ni desactiva RLS."

[[flow.steps]]
name = "6. Recuperación"
condition = "¿Existe embedder?"
on_true = "Usar remote_repository si existe; en caso contrario crear LocalRepository y cargar el índice en memoria. Construir Retriever y recuperar candidatos para CONSULTA."
on_false = "Informar que la recuperación no se ejecutó."
retrieval = "Retriever combina candidatos de coseno y BM25 con fusión de rangos; devuelve Top-3 con metadatos y puntajes de coseno."
notes = "Esta versión sí usa recuperación híbrida. No sustituirla por la RPC exacta de la versión simplificada. El puntaje no es confianza ni suficiencia documental."

[[flow.steps]]
name = "7. Contrato y presupuesto"
actions = [
  "Inspeccionar SolicitudTI, RespuestaRAG y prompts versionados",
  "Comprobar presupuesto de clasificación para CONSULTA",
  "Validar una respuesta fixture explícitamente simulada",
  "Ejecutar control negativo de cita F99 inexistente; capturar su rechazo esperado",
  "Si existen candidatos, construir contexto con pasajes completos y registrar omisiones"
]
notes = "Máximo de entrada: 1000 tokens por llamada, incluyendo esquema y reserva de formato. El contexto de generación se selecciona para un presupuesto de 850, reservando 150 para corrección. El control negativo esperado no es un fallo del notebook."

[[flow.steps]]
name = "8. Consulta principal"
condition = "RUN_GROQ_QUERY o RUN_LOCAL_MOCK"
on_false = "Mostrar que generación y mock no se ejecutaron."
on_true = "Exigir retriever y, si RUN_GROQ_QUERY, conexión remota. Elegir groq si RUN_GROQ_QUERY es true; en otro caso mock. Ejecutar run_rag_case y registrar resultado."
output = "Añadir resultado a observed_results, guardar consulta.json, mostrar clasificación, estado final, respuesta documental, revisión y fuentes citadas si existen."
notes = "Si ambos indicadores son true, tiene precedencia groq. No transformar salidas simuladas en evidencia de generación real."

[[flow.steps]]
name = "9. Pruebas"
actions = [
  "Mostrar preguntas y expectativas de la clase y cargar la suite ampliada"
]
branches = [
  "RUN_CLASS08_CASES: exigir retriever y sesión; iterar cinco casos, ejecutar pipeline real, guardar cada traza y pruebas_clase08.json; si aparece HTTP 429, interrumpir los casos restantes de ese bucle",
  "RUN_REMOTE_REGRESSION: ejecutar scripts.validate_rag_scenarios como subprocess; su fallo detiene Run All mediante check=True",
  "RUN_LOCAL_TESTS: ejecutar unittest y manage.py test api; check=True propaga fallos"
]
notes = "No fusionar las cinco pruebas y la regresión de diez casos. No añadir condiciones de dependencia que no existan en el código. Los casos no ejecutados por cuota no cuentan como aprobados."

[[flow.steps]]
name = "10. Persistencia y PDF"
condition = "CONNECT_SUPABASE"
on_true = "verify(INDEX_PATH): abrir dos clientes nuevos del mismo usuario, comprobar inventario y RPC con una sonda basada en el primer vector guardado; guardar persistencia.json."
on_false = "Indicar persistencia remota no comprobada en esta sesión."
actions = ["Mostrar referencias a evidencia histórica sin atribuirla a esta ejecución"]
secondary_condition = "GENERATE_PDF"
secondary_true = "Exigir observed_results no vacío; registrar resultados disponibles y generar clase08.pdf con PDFReport."
notes = "La persistencia de esta versión usa la sonda del primer fragmento, no necesariamente CONSULTA. No certifica aislamiento entre usuarios diferentes. El PDF se genera antes del anexo OCR: puede requerir regeneración si después se añade una consulta OCR."

[[flow.steps]]
name = "Anexo A. OCR"
condition = "RUN_OCR"
on_true = "Procesar OCR_IMAGE mediante prepare_multimodal_input y mostrar texto/validez; si RUN_GROQ_QUERY, ejecutar además run_rag_case con imagen y añadir/guardar ocr_consulta.json."
on_false = "Mostrar OCR no ejecutado."
notes = "Distinguir extracción OCR de generación. No dibujar ingestión Word/Excel, que esta implementación no tiene."

[[flow.steps]]
name = "Anexo B. API"
condition = "RUN_API_CHECKS"
on_true = "Consultar por HTTP local health, openapi.json y categories; cargar el token desde .env sin mostrarlo y exigir respuestas satisfactorias."
on_false = "Mostrar comprobación HTTP no ejecutada."
notes = "El notebook no arranca Django. El servidor debe existir. Estas tres comprobaciones no llaman al endpoint rag/query ni consumen Groq por sí mismas."

[[flow.steps]]
name = "Cierre"
actions = [
  "Construir closure con opciones, corpus, prompts, resultados observados y comprobaciones realizadas",
  "Mantener revisión humana y pendientes explícitos",
  "Guardar bitacora.json en RUN_DIR y finalizar"
]

[pipeline_detail]
representation = "Dentro de la actividad run_rag_case, mostrar un subflujo agrupado con las etapas siguientes, manteniendo el diagrama como un único diagrama de actividades. No añadir llamadas externas que no se desprendan del código."
steps = [
  "Preparar texto y OCR opcional",
  "Clasificar como SolicitudTI y validar",
  "En modo real, aplicar políticas locales auditables",
  "Recuperar candidatos con Retriever y, en modo real, filtrar pertinencia",
  "Construir contexto etiquetado y catálogo de fuentes dentro del presupuesto",
  "Generar RespuestaRAG real o usar fixture si es mock",
  "Validar estructura, etiquetas y coherencia de citas",
  "En modo real, revisar respaldo documental; permitir como máximo una corrección y nueva revisión",
  "Conservar la precedencia de la decisión local de clasificación y calcular estado final",
  "Devolver resultado y traza, incluso cuando se registra un error técnico o de formato"
]
error_rule = "Distinguir errores capturados por el pipeline, que producen ERROR_TECNICO/ERROR_FORMATO y retornan una traza, de excepciones no capturadas en celdas, que detienen Run All. No dibujar la continuación hasta el cierre tras un error de celda no capturado."
mock_rule = "En mock no hay generación ni revisión real de Groq; no marcar MODEL_SUPPORTED ni comprensión semántica real."

[constraints]
rules = [
  "Representar ejecución secuencial. No inventar paralelismo, colas, usuarios, herramientas o endpoints.",
  "No confundir el flujo general configurable con las ramas efectivamente habilitadas hoy.",
  "No insertar secretos, contraseñas, tokens o datos personales en el diagrama.",
  "No afirmar que citas válidas equivalen a pertinencia o fidelidad semántica.",
  "No sustituir una salida ERROR_TECNICO por evidencia_insuficiente.",
  "No confundir este notebook de opciones/anexos con el notebook del profesor ni con la adaptación simplificada anterior.",
  "No añadir sync con borrado, reindexación por cada pregunta, comandos operativos de TI ni cambios automáticos de permisos.",
  "Mantener legibilidad: agrupar detalles internos y usar notas breves para límites y artefactos, sin omitir decisiones relevantes."
]

[acceptance]
checks = [
  "El código es un único diagrama de actividades PlantUML completo.",
  "Incluye inicio, validación del entorno, las diez fases, los dos anexos y cierre.",
  "Cada indicador configurable está representado con sus dos ramas o una nota de omisión inequívoca.",
  "Se distinguen Supabase, Groq, repositorio local, OCR y HTTP del backend.",
  "Expresa correctamente la selección real/mock y sus dependencias.",
  "Incluye los bucles y las condiciones de interrupción realmente existentes.",
  "Ubica correctamente los archivos de evidencia y la generación PDF anterior al OCR.",
  "Separa errores de celda, errores del pipeline y control negativo de citas esperado.",
  "No afirma que todas las ramas hayan sido probadas o ejecutadas.",
  "La salida no contiene explicaciones externas al bloque PlantUML ni dependencias de includes remotos."
]
