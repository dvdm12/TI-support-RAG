services:
  backend:
    image: ti-support-rag-backend:local
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ../backend/data/indexes/sections
        target: /app/data/indexes/sections
        read_only: true
        bind:
          create_host_path: false
      - model-cache:/home/app/.cache/huggingface
      - tokenizer-cache:/home/app/.cache/tiktoken
    init: true
    restart: unless-stopped

  frontend:
    image: ti-support-rag-frontend:local
    build:
      context: ../frontend
      # docker compose --env-file ../backend/.env up -d --build
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    environment:
      BACKEND_URL: http://backend:8000
      DJANGO_API_TOKEN: ${DJANGO_API_TOKEN:-}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    init: true
    restart: unless-stopped

  gradio:
    image: ti-support-rag-gradio:local
    build:
      context: ../app
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_API_TOKEN: ${DJANGO_API_TOKEN:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:7860:7860"
    depends_on:
      - backend
    init: true
    restart: unless-stopped

volumes:
  model-cache:
    name: ti-support-rag-model-cache
  tokenizer-cache:
    name: ti-support-rag-tokenizer-cache
